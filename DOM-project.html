<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Project</title>
    <style>
        body {
            font-family: Arial;
        }
        .subscribe-button {
            border: none;
            background-color: black;
            color: white;
            padding: 12px;
            margin-bottom: 30px;
            font-weight: bold;
            font-style: italic;
            border-radius: 30px;
            cursor: pointer;

        }
        .is-subscribed {
            background-color:rgb(240, 240, 240);
            border: 2px solid gray;
            color: black;
        }
        .css-cost {
            font-size: 15px;
            padding: 10px;
        }
        .calculate {
            border: none;
            font-size: 15px;
            padding: 12px 15px;
            background-color: green;
            color: white;
            cursor: pointer;
        }
        .error-message {
            color: red;
        }
    </style>
</head>
<body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
        toSubscribe()
    " class="js-button subscribe-button">Subscribe</button>

    <p>Rock Paper Scissors</p>
    <a href="Rock-paper-scissors/Rock-paper-scissors.html">Click here</a>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>
    <input type="number" 
        class="js-cost css-cost" 
        placeholder="Input Item Cost"
        onkeydown="calculateWithEnterKey()"
    >
    <button onclick="totalAmount()" class="calculate">Calculate</button>
    <p class="result"></p>
    
    <script src="dom.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Project</title>
    <style>
        body {
            font-family: Arial;
        }
        .subscribe-button {
            border: none;
            background-color: black;
            color: white;
            padding: 12px;
            margin-bottom: 30px;
            font-weight: bold;
            font-style: italic;
            border-radius: 30px;
            cursor: pointer;

        }
        .is-subscribed {
            background-color:rgb(240, 240, 240);
            border: 2px solid gray;
            color: black;
        }
        .css-cost {
            font-size: 15px;
            padding: 10px;
        }
        .calculate {
            border: none;
            font-size: 15px;
            padding: 12px 15px;
            background-color: green;
            color: white;
            cursor: pointer;
        }
        .error-message {
            color: red;
        }
    </style>
</head>
<body>
    <p>YouTube Subscribe Button</p>
    <button onclick="
        toSubscribe()
    " class="js-button subscribe-button">Subscribe</button>

    <p>Rock Paper Scissors</p>
    <a href="Rock-paper-scissors/Rock-paper-scissors.html">Click here</a>

    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping</p>
    <p>Orders over $40 = FREE shipping</p>
    <input type="number" 
        class="js-cost css-cost" 
        placeholder="Input Item Cost"
        onkeydown="calculateWithEnterKey()"
    >
    <button onclick="totalAmount()" class="calculate">Calculate</button>
    <p class="result"></p>
    <script>
        function toSubscribe() {
            const buttonElement = document.querySelector('.js-button');
            if (buttonElement.innerText === 'Subscribe'){
                buttonElement.innerText = 'Subscribed';
                buttonElement.classList.add('is-subscribed');
                // buttonElement.classList.replace('subscribe-button','is-subscribed')
            } else {
                buttonElement.innerText = 'Subscribe';
                buttonElement.classList.remove('is-subscribed');
                // buttonElement.classList.replace('is-subscribed','subscribe-button')
            }
        }
        function calculateWithEnterKey() {
            if (event.key === 'Enter') {
                totalAmount()
            }
        }
        function totalAmount() {
            let amount = Number(document.querySelector('.js-cost').value);
            if (amount < 0) {
                document.querySelector('.result').classList.add('error-message')
                document.querySelector('.result').innerHTML = 'Error: cost cannot be less than $0';
            } else if (amount === 0 || amount > 40) {
                document.querySelector('.result').classList.remove('error-message')
                document.querySelector('.result').innerHTML = `$${amount}`;
            } else if (0 <= amount <= 40 ) {
                amount = Math.round(amount * 100 + 1000) / 100
                // amount += 10;
                document.querySelector('.result').classList.remove('error-message')
                document.querySelector('.result').innerHTML = `$${amount}`;
            }
        }
    </script>
</body>
</html>
